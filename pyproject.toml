[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "aliyun-mirrors"
url = "https://mirrors.aliyun.com/pypi/web/simple"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu124"
format = "flat"
explicit = true

[tool.black]
target-version = ["py311"]
skip-string-normalization = false
exclude = '''
.git/
|.venv/
'''

